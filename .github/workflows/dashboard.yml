name: Dashboard estático (GitHub Pages)

# Renderiza dashboard/index.qmd a HTML autocontenido y lo publica en gh-pages.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/inputs_md/**"
      - "style/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::ggplot2
            any::plotly
            any::here
            any::knitr
            any::rmarkdown

      - name: Render del dashboard
        run: |
          quarto render dashboard/index.qmd
          mkdir -p _site
          cp dashboard/index.html _site/index.html

      - name: Publicar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
